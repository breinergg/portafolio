<header class="site-header" [class.site-header--open]="isMenuOpen()">
  <div class="site-header__bar">
    <a class="site-header__brand" href="#inicio" (click)="closeMenu()">Breiner</a>

    <button
      type="button"
      class="site-header__trigger"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="site-navigation"
      [attr.aria-label]="isMenuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
      (click)="toggleMenu()"
    >
      <span class="site-header__icon" [class.site-header__icon--open]="isMenuOpen()" aria-hidden="true">
        <svg class="site-header__dots" width="16" height="4" viewBox="0 0 16 4" fill="currentColor">
          <circle cx="2" cy="2" r="1.6"/>
          <circle cx="8" cy="2" r="1.6"/>
          <circle cx="14" cy="2" r="1.6"/>
        </svg>
        <svg class="site-header__close" width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2.5 2.5L11.5 11.5M11.5 2.5L2.5 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
    </button>
  </div>

  <div class="site-header__panel">
    <nav
      id="site-navigation"
      class="site-header__nav"
      aria-label="Navegación principal"
      [attr.inert]="isMenuOpen() ? null : ''"
    >
      <a href="#sobre-mi" (click)="closeMenu()"><span>Sobre mí</span></a>
      <a href="#habilidades" (click)="closeMenu()"><span>Habilidades</span></a>
      <a href="#proyectos" (click)="closeMenu()"><span>Proyectos</span></a>
      <a href="#contacto" (click)="closeMenu()"><span>Contacto</span></a>
    </nav>
  </div>
</header>
