<section id="proyectos" class="projects" aria-labelledby="projects-title">
  <div class="projects__container">
    <header class="projects__heading" appReveal>
      <div>
        <p class="projects__eyebrow">(Proyectos seleccionados)</p>
        <h2 id="projects-title" class="projects__title">Proyectos<br />destacados<span class="title-dot" aria-hidden="true">.</span></h2>
      </div>
    </header>

    <div class="projects__grid">
      <article class="project project--inventory" appReveal>
        <div class="project__preview">
          <img
            class="project__image"
            src="/images/projects/p2.webp"

            width="1280"
            height="600"
            loading="lazy"
            decoding="async"
          />
        </div>
        <div class="project__meta">
          <div>
            <h3>PreviDocs</h3>
            <p>Sistema de gestión de historias clínicas · Angular · ASP.NET Core</p>
          </div>
        </div>
      </article>

      <article class="project project--analytics" appReveal>
        <div class="project__preview">
          <img
            class="project__image"
            src="/images/projects/gg1.webp"
            alt="Pantalla de inicio de sesión de Gonzai"
            width="1280"
            height="600"
            loading="lazy"
            decoding="async"
          />
        </div>
        <div class="project__meta">
          <div>
            <h3>Gonzai</h3>
            <p>Sistema Inteligente de Gestión Empresarial · Angular · ASP.NET Core</p>
          </div>
        </div>
      </article>
    </div>
